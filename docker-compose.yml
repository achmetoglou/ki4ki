# ============================================================================
#  KI4KI Wissensdatenbank - Paket fuer Netzwerkpartner
#
#  Ein Befehl:  ./start.sh
#
#  Alle Abbilder sind auf den Fingerabdruck festgenagelt, mit dem diese
#  Fassung geprueft wurde. Ein Partner, der in drei Monaten installiert,
#  bekommt EXAKT dieselbe Anlage - nicht die neueste, die vielleicht anders
#  laeuft. Aktualisiert wird bewusst, nie nebenbei.
#
#  Daten bleiben im Haus: kein Dienst spricht nach draussen.
# ============================================================================
name: ki4ki

services:

  # --- Sprachmodell ---------------------------------------------------------
  ollama:
    image: ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0
    container_name: ki4ki-ollama
    restart: unless-stopped
    # ⭐ GESCHWINDIGKEIT (gemessen 25.08. an den Ollama-Zugriffszeiten):
    #   - Modelle wurden nach 5 Minuten Ruhe ENTLADEN: das kleine Modell
    #     (Auffangnetz) lud vor fast jeder Frage 3-5 s neu, das Suchmodell
    #     (bge-m3) 2-7 s. KEEP_ALIVE=-1 haelt alle drei im Speicher
    #     (zusammen ~12 GB; die Karte hat 48 GB).
    #   - Eine Chat-Antwort wartete 61 s hinter der Dokument-Verschlagwortung
    #     der Aufnahme (gleiches Modell, eine Warteschlange). NUM_PARALLEL=2
    #     laesst zwei Anfragen gleichzeitig durch.
    #   - CONTEXT_LENGTH setzt die Standard-Kontextgroesse fuer Aufrufe OHNE
    #     eigene Angabe (Docling-Bildbeschreibung ueber die OpenAI-Schnitt-
    #     stelle). Weicht sie von der der anderen Aufrufe ab, laedt Ollama
    #     das Modell bei jedem Wechsel neu (~7 s). Alle Aufrufe: 65536.
    #   - FLASH_ATTENTION beschleunigt das Einlesen langer Eingaben.
    environment:
    - OLLAMA_KEEP_ALIVE=-1
    - OLLAMA_NUM_PARALLEL=2
    - OLLAMA_CONTEXT_LENGTH=65536
    - OLLAMA_FLASH_ATTENTION=1
    volumes:
    - modelle:/root/.ollama
    # kein veroeffentlichter Anschluss: nur die anderen Dienste sprechen mit ihm

  # --- Vermittler: haengt "think": false an, damit das Modell nicht laut denkt
  nothink-proxy:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    container_name: ki4ki-nothink
    restart: unless-stopped
    command: python /app/proxy.py
    volumes:
    - ./nothink-proxy:/app:ro
    depends_on:
    - ollama

  # --- Textauszug aus PDF ---------------------------------------------------
  docling:
    image: ghcr.io/docling-project/docling-serve@sha256:c2ba5f78e87cdc791bff9817258c3a80d6aa3ee82bb4850dcc8872ace6ea1f74
    container_name: ki4ki-docling
    restart: unless-stopped
    command: docling-serve run
    environment:
    - OMP_NUM_THREADS=4
    # gegen Speicher-Zerstueckelung: die Formelerkennung scheiterte sonst bei
    # grossen Dokumenten mit "out of memory", obwohl genug Speicher da war
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # Voreinstellung 120 s brach grosse PDFs still mit HTTP 504 ab
    - DOCLING_SERVE_MAX_SYNC_WAIT=21600
    # ⚠ 6 Stunden, nicht 1. Ein Lauf brach nach exakt einer
    #   Stunde ab - das war diese Grenze, nicht ein Fehler. Sie haengt
    #   am Dokument, nicht am Rechner: eine grosse Arbeit mit vielen
    #   Abbildungen braucht laenger als 3600 Sekunden.
    #   BEHELF - richtig waere der asynchrone Weg (/v1/convert/file/async).
    - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=5
    # ⭐ OHNE DIESE ZWEI liefert Docling bei aktivierter Bildbeschreibung
    #   LEEREN Text zurueck (der ganze Convert bricht ab) - und die Aufnahme
    #   sortiert das Dokument still als "rohtext leer" aus. Der Aufnahme-
    #   Workflow schickt eine EIGENE Bildbeschreibungs-Config, die den
    #   ollama-VLM fernaufruft; docling-serve verbietet beides per Default:
    #   - ALLOW_CUSTOM_...: eigene Bildbeschreibungs-Konfig erlauben
    #     (sonst: "Custom picture description configuration is not allowed")
    #   - ENABLE_REMOTE_SERVICES: Fernaufruf an ollama ueberhaupt zulassen
    #   Auf der laufenden T4 sind beide gesetzt; im Paket fehlten sie.
    - DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG=true
    - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
    volumes:
    - docling-modelle:/opt/app-root/src/.cache/docling/models

  # --- Textauszug aus allem anderen (Text, HTML, Tabellen) ------------------
  tika:
    image: apache/tika@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    container_name: ki4ki-tika
    restart: unless-stopped

  # --- Rechte-Vorlauf -------------------------------------------------------
  # Frisch angelegte Docker-Volumes gehoeren root. n8n laeuft aber als
  # node (1000) und MUSS in die geteilten Ordner schreiben (Laufsperre,
  # JSON, Markdown) und Dateien nach archiv/ verschieben. Ohne diesen
  # Vorlauf scheitert die Aufnahme auf JEDER frischen Installation still
  # beim allerersten Schreibversuch - kein Partner soll das je erleben.
  # Laeuft bei jedem `up` kurz an, uebergibt die Ordner an node und
  # beendet sich; n8n startet erst, wenn er fertig ist. Nutzt das ohnehin
  # vorhandene n8n-Image (kein zusaetzlicher Download).
  rechte-init:
    image: docker.n8n.io/n8nio/n8n@sha256:15091606d98f6d15bad10cb26bb937ccb47dfd9fee2bb7ae44c7061cba2e7a04
    container_name: ki4ki-rechte-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
    - |
      for d in /files/json /files/processed /files/anythingllm; do
        mkdir -p "$$d" && chown -R 1000:1000 "$$d"
      done
      # ./dokumente teilen sich n8n (1000) und der MENSCH auf dem Server
      # (seine Gruppe kommt aus der .env, KI4KI_GID): Ordner 2775 mit
      # setgid, Dateien 664 - so kann er per SFTP/scp Massenlaeufe
      # einspielen, und n8n darf weiterhin verschieben.
      # NUR anfassen, was wirklich falsch steht: chown/chmod auf eine schon
      # richtige Datei schreibt trotzdem ihre ctime neu - und an der ctime
      # haengen die Claim-Garantie (3 h) und das Einraeumen (1 h). Jedes
      # Update haette sonst beide Uhren fuer alles in input/ auf null
      # gestellt (gemessen 25.08.).
      mkdir -p /files/dokumente
      G=${KI4KI_GID:-1000}
      find /files/dokumente ! -user 1000 -exec chown 1000 {} +
      find /files/dokumente ! -group "$$G" -exec chgrp "$$G" {} +
      find /files/dokumente -type d ! -perm 2775 -exec chmod 2775 {} +
      find /files/dokumente -type f ! -perm 664 -exec chmod 664 {} +
      echo "Rechte gesetzt: n8n (1000) und Server-Nutzer (Gruppe ${KI4KI_GID:-1000}) duerfen schreiben."
    volumes:
    - ./dokumente:/files/dokumente
    - austausch:/files/processed
    - austausch-json:/files/json
    - austausch-md:/files/anythingllm
    restart: "no"

  # --- Ablaufsteuerung ------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:15091606d98f6d15bad10cb26bb937ccb47dfd9fee2bb7ae44c7061cba2e7a04
    container_name: ki4ki-n8n
    restart: unless-stopped
    depends_on:
      rechte-init:
        condition: service_completed_successfully
    # bringt KI4KI_API_KEY herein - die Ingest-Workflows brauchen ihn fuer den
    # Upload zu AnythingLLM ("=Bearer {{$env.KI4KI_API_KEY}}")
    env_file:
    - ./.secrets.env
    ports:
    - "5678:5678"
    environment:
    - N8N_ENABLE_EXECUTE_COMMAND=true
    # ohne das kann der Workflow $env.KI4KI_API_KEY nicht lesen -> Upload 401
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    # n8n 2.31 sperrt den executeCommand-Node sonst per Default (dann steht
    # "Install this node to use it"). Leere Ausschlussliste = nichts sperren.
    - NODES_EXCLUDE=[]
    - N8N_RESTRICT_FILE_ACCESS_TO=/files
    # ohne das blockt n8n den Login ueber http:// - betrifft JEDEN ohne HTTPS
    - N8N_SECURE_COOKIE=false
    # Binaerdaten auf die Platte statt in den Arbeitsspeicher: 1.171 PDFs
    # sind 8,9 GB und sprengten den Node-Speicher
    - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    - NODE_OPTIONS=--max-old-space-size=8192
    # keine Nutzungsdaten nach draussen
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    # Kein zweiter Login: Die "Set up owner account"-Wand auf :5678 richtet
    # start.sh automatisch mit DEMSELBEN Admin-Passwort ein (POST
    # /rest/owner/setup). n8n ist eine interne Maschine - Partner brauchen den
    # Editor nie; die Aufnahme laeuft ueber einen offenen Webhook, ohne Login.
    # (Der fruehere Schalter N8N_USER_MANAGEMENT_DISABLED wirkt ab n8n 2.31
    #  nicht mehr - deshalb der Weg ueber start.sh.)
    # Zeitzone: sonst schreibt n8n die Zeitstempel (z.B. in aussortiert.log)
    # in der Container-Voreinstellung (UTC/US) - das verwirrt, weil es nicht
    # zur Server-Uhr passt. TZ steuert die Uhr fuer new Date() in Code-Nodes,
    # GENERIC_TIMEZONE den Zeitplan-Ausloeser. Standard deutsche Zeit,
    # ueberschreibbar per .env (z.B. TZ=Europe/Vienna) fuer Partner anderswo.
    - TZ=${TZ:-Europe/Berlin}
    - GENERIC_TIMEZONE=${TZ:-Europe/Berlin}
    # Bildbeschreibung: der Aufnahme-Workflow liest diese Einstellung.
    #   "an"  (Standard) = nur substanzielle Abbildungen/Diagramme via VLM
    #                      beschreiben (Schwelle 0.08) - gute Qualitaet,
    #                      Mini-Grafiken/Logos werden uebersprungen.
    #   "aus"            = nur Text + Bildunterschriften, keine VLM-Bild-
    #                      beschreibung -> deutlich schneller (fuer Massenlaeufe
    #                      oder textlastige Bestaende).
    #   Standard "aus" (Entscheidung 25.08.): Gemessen gingen 6 von 7 Minuten
    #   einer Aufnahme in die Bildbeschreibung (jedes Bild ~6 s durch dasselbe
    #   Modell, das auch antwortet). Text, Tabellen, Formeln sind nach ~1-2
    #   Minuten durchsuchbar; die Dokumente stehen in bilder-nachholen.txt und
    #   bekommen ihre Bilder nachgelagert. Wer Bilder sofort will: .env mit
    #   KI4KI_BILDBESCHREIBUNG=an.
    - KI4KI_BILDBESCHREIBUNG=${KI4KI_BILDBESCHREIBUNG:-aus}
    # Formeln als LaTeX (CodeFormula-Modell): gemessen 26.08. ~6 Minuten je
    # Dissertation (130 Formelbilder), auch ohne Bildbeschreibung. Standard
    # aus - kommt mit der nachgelagerten Anreicherung. Sofort: KI4KI_FORMELN=an.
    - KI4KI_FORMELN=${KI4KI_FORMELN:-aus}
    # Massenlauf-Automatik: Liegen mindestens so viele Dateien im Eingang,
    # laeuft der Durchgang OHNE Bildbeschreibung (Stunden statt Wochen) und
    # jedes Dokument kommt in <bereich>/bilder-nachholen.txt zum spaeteren
    # Nachreichen der Bilder. Alltag (einzelne Uploads) bleibt mit Bildern.
    # Niemand schaltet von Hand. Per .env aenderbar.
    - KI4KI_MASSENLAUF_AB=${KI4KI_MASSENLAUF_AB:-6}
    volumes:
    - n8n-daten:/home/node/.n8n
    - ./dokumente:/files/dokumente
    - austausch:/files/processed
    - austausch-json:/files/json
    - austausch-md:/files/anythingllm

  # --- Oberflaeche + Wissensspeicher ---------------------------------------
  anythingllm:
    image: mintplexlabs/anythingllm@sha256:9a87bca983e688db2a11a0ed3290daa16c4b67556617ae77325c9d12c6a37c25
    container_name: ki4ki-anythingllm
    restart: unless-stopped
    env_file:
    - ./.secrets.env
    environment:
    - STORAGE_DIR=/app/server/storage
    - LLM_PROVIDER=ollama
    - OLLAMA_BASE_PATH=http://nothink-proxy:11435
    - OLLAMA_MODEL_PREF=gemma4:12b
    - OLLAMA_KEEP_ALIVE_TIMEOUT=14400
    # ⭐ OHNE DAS SIEHT DAS MODELL NUR DIE ERSTE FUNDSTELLE.
    # AnythingLLM teilt das Fenster fest auf: 15 % Systemteil, 70 % Frage,
    # 15 % Verlauf. Die gefundenen Textstellen landen im Systemteil. Bei der
    # Voreinstellung blieben dafuer ~690 Einheiten - eine einzelne Stelle ist
    # bis 3.000 Zeichen lang. Alles ab der zweiten wurde abgeschnitten, ohne
    # dass es irgendwo auffiel. Gemessen: 1 statt 3 zitierte Arbeiten.
    # Obergrenze ist die Grafikkarte, nicht die Software - siehe LIESMICH.
    - OLLAMA_MODEL_TOKEN_LIMIT=65536
    # ⭐ sonst springt der Chat bei lokalen Modellen von selbst in den
    # Agent-Modus - dort gibt es KEINE Quellenangaben. Der Wert ist eine
    # Liste von Anbieter-Kuerzeln, kein Schalter: "all" waere wirkungslos.
    - PROVIDER_DISABLE_NATIVE_TOOL_CALLING=ollama
    - EMBEDDING_ENGINE=ollama
    - EMBEDDING_BASE_PATH=http://ollama:11434
    - EMBEDDING_MODEL_PREF=bge-m3:latest
    # gemessen: 4000 Zeichen -> 3 von 25 Stuecken abgewiesen, 3000 -> keines
    - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=3000
    - OLLAMA_EMBEDDING_BATCH_SIZE=8
    - VECTOR_DB=lancedb
    - DISABLE_TELEMETRY=true
    volumes:
    - anythingllm-daten:/app/server/storage
    # kein veroeffentlichter Anschluss: der Zugang laeuft ueber die
    # Belegpruefung, damit niemand versehentlich daran vorbeigeht

  # --- Belegpruefung: sitzt VOR AnythingLLM ---------------------------------
  pruef-proxy:
    build: ./pruef-proxy
    image: ki4ki-pruef-proxy:1
    container_name: ki4ki-pruef-proxy
    restart: unless-stopped
    ports:
    - "3001:3001"
    # bringt KI4KI_API_KEY herein - fuer die Selbstheilung neu angelegter
    # Bereiche (siehe KI4KI_BEREICH_HEILEN weiter unten)
    env_file:
    - ./.secrets.env
    environment:
    - KI4KI_ZIEL=http://anythingllm:3001
    - KI4KI_POSITIVLISTE=sperren
    - KI4KI_AUFFANGNETZ=1
    - KI4KI_E2B_ANTWORT=1
    - KI4KI_MODELL_ANZEIGE=1
    - KI4KI_NENNUNG_TILGEN=1
    # ⭐ Jeder NEU angelegte Arbeitsbereich (per Skript ODER per Klick in der
    #   Oberflaeche) bekommt automatisch die gepruef-ten Werte: Prompt, Modus
    #   "query", topN/Schwelle/Verlauf/Temperatur. So ist er von Geburt an
    #   beleg-faehig. BESTEHENDE Bereiche werden nie angefasst. =0 schaltet ab.
    - KI4KI_BEREICH_HEILEN=1
    - KI4KI_SYSTEMPROMPT=/systemprompt.txt
    # fuer Zusammenfassungen ganzer Dokumente: am Suchweg vorbei
    - KI4KI_MODELL=http://nothink-proxy:11435/api/chat
    - KI4KI_MODELL_NAME=gemma4:12b
    - KI4KI_BESTAND=/daten/bestand/documents
    - KI4KI_PDFS=/daten/pdfs
    # Wohin der Hochladen-Knopf schreibt. Derselbe Ordner, den n8n
    # als /files/dokumente liest - so landet beides an derselben Stelle.
    - KI4KI_EINGANG=/daten/eingang
    - KI4KI_GEDAECHTNIS=/daten/pruefung/geprueft.json
    # Das faelschungssichere Antwort-Protokoll (Audit-Trail) ins Daten-Volume:
    # Vorher lag es im Container unter /app/.protokoll und war bei jedem
    # Neubau des Proxys (jedes aktualisiere.sh) WEG - fuer einen Nachweis
    # untragbar. Schluessel liegen mit im Ordner und ueberleben so ebenfalls.
    - KI4KI_PROTOKOLL=/daten/pruefung/protokoll
    # ⚠ ALLES, was der Proxy sich merkt, ins Daten-Volume - sonst ist es beim
    #   naechsten aktualisiere.sh (Container-Neubau) weg. Gemessen 25.08.:
    #   Gespraechsfaeden mit Bestandslisten/Bildern/Zusammenfassungen leer,
    #   weil der Nachtrag-Speicher im Container lag. Auf dem Testserver fiel
    #   das nie auf (dort ist /app von der Platte eingehaengt).
    - KI4KI_THREAD_NACHTRAG=/daten/pruefung/thread-nachtrag.json
    - KI4KI_THREAD_ARBEITET=/daten/pruefung/thread-arbeitet.json
    - KI4KI_ZUGANG_SCHLUESSEL=/daten/pruefung/zugang-schluessel
    - KI4KI_DOKZUGANG=/daten/pruefung/dokzugang.json
    - KI4KI_WORTVERZEICHNIS=/daten/pruefung/wortverzeichnis.json
    - KI4KI_ZUSAMMENFASSUNGEN=/daten/pruefung/zusammenfassungen
    # Faden-Gedaechtnis (welches Dokument je Gespraechsfaden Thema ist):
    # dauerhaft, ueberlebt Updates.
    - KI4KI_FADEN_GEDAECHTNIS=/daten/pruefung/faden-gedaechtnis.json
    # Loesch-Wache: PDF nach <bereich>/loeschen/ legen -> Dokument wird
    # ueberall entfernt (Arbeitsbereiche, System, Katalog, Vormerkliste,
    # Archiv-PDF), Protokoll in <bereich>/loeschen.log. Nur dieser Ordner
    # loest Loeschen aus. Abschaltbar mit 0.
    - KI4KI_LOESCHEN=1
    # Zeitstempel in aussortiert.log/claim.log in Ortszeit (gemessen 25.08.:
    # UTC, zwei Stunden daneben). Gleiche Quelle wie n8n.
    - TZ=${TZ:-Europe/Berlin}
    # Weg zum Menschen (GESPRAECH-ANFORDERUNGEN §1.14): Name/Mail des
    # Verantwortlichen, erscheint bei "steht nicht drin" und Anlage-Fragen.
    # Leer = kein Hinweis. Beispiel in .env: KI4KI_KONTAKT=Max Mustermann, m.mustermann@institut.de
    - KI4KI_KONTAKT=${KI4KI_KONTAKT:-}
    # K2/K5: Wer /kpi und /rueckmeldungen sehen darf (Kontonamen, kommagetrennt).
    # Bewusst NICHT an die Adminrolle gekoppelt (siehe Protokollkonzept).
    - KI4KI_PROTOKOLL_EINSICHT=${KI4KI_PROTOKOLL_EINSICHT:-admin}
    # ⭐ STUFE 1 (ARCHITEKTUR-GESPRAECH.md): Das Modell erkennt die Absicht
    # jeder Eingabe im Gespraechszusammenhang; Regeln bleiben Waechter und
    # Rueckfall. Abnahme 26.08.: 31/32 Zuege (97 %) mit gemma4:12b, 3,0 s je
    # Zug; gemma4:e2b nur 84 % (1,9 s) -> nicht gut genug. Standard an;
    # KI4KI_ABSICHT_MODELL=0 in der .env schaltet auf den Regel-Router zurueck.
    - KI4KI_ABSICHT_MODELL=${KI4KI_ABSICHT_MODELL:-1}
    - KI4KI_ABSICHT_MODELL_NAME=${KI4KI_ABSICHT_MODELL_NAME:-gemma4:12b}
    # ⭐ STUFE 2: Das Modell fuehrt das Gespraech selbst (Werkzeuge, ganzer
    # Faden, Rueckmeldungen, zwei Aufgaben in einem Zug). Standard 0 bis zur
    # Abnahme; 1 = an (Stufe 1 laeuft dann nur noch als Rueckfall).
    - KI4KI_GESPRAECH=${KI4KI_GESPRAECH:-0}
    - KI4KI_GESPRAECH_MODELL=${KI4KI_GESPRAECH_MODELL:-gemma4:12b}
    - KI4KI_ZWISCHENSPEICHER=/daten/pruefung/vorauswahl.pickle
    # Der Katalog (Titel/Verfasser/Jahr je Dokument) - dauerhaft im
    # Daten-Volume, nicht im Abbild: Was das Modell vom Deckblatt liest,
    # muss einen Neubau des Containers ueberleben.
    - KI4KI_BESTANDSINDEX=/daten/pruefung/bestandsindex.json
    # Gruppe des Server-Nutzers (aus .env): neu angelegte Bereichs-Ordner
    # bekommen 1000:<Gruppe> + setgid, damit Mensch UND n8n schreiben.
    - KI4KI_GID=${KI4KI_GID:-1000}
    # Beim Hochladen ueber die Oberflaeche die Aufnahme direkt anstossen.
    # Hier ist n8n der einzige Weg: Es gibt weder Waechter noch Zyklus,
    # eine Anstoss-Datei wuerde niemand lesen.
    - KI4KI_AUFNAHME_HAKEN=http://n8n:5678/webhook/ki4ki-aufnahme
    volumes:
    - anythingllm-daten:/daten/bestand:ro
    - ./dokumente:/daten/pdfs:ro
    # Zweiter, SCHREIBBARER Weg in denselben Ordner - nur fuer den
    # Hochladen-Knopf der Oberflaeche. Ohne ihn kann der Proxy die Datei
    # nirgends ablegen, und der Upload-Weg ist tot.
    - ./dokumente:/daten/eingang
    - pruefdaten:/daten/pruefung
    # den gepruef-ten Systemprompt lesbar machen (fuer die Selbstheilung)
    - ./systemprompt.txt:/systemprompt.txt:ro
    # Die Wortlisten von der Platte, nicht aus dem Abbild: So wirkt eine
    # Aenderung an ~/ki4ki/pruef-proxy/wortlisten.txt SOFORT (die Datei
    # wird bei jeder Frage auf ihren Zeitstempel geprueft) - ohne Neubau,
    # ohne Neustart. Faellt der Mount weg, greift die Kopie im Abbild.
    - ./pruef-proxy/wortlisten.txt:/app/wortlisten.txt:ro
    depends_on:
    - anythingllm
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/pruef-status', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s


  # --- Markdown-Erzeugung: von n8n aufgerufen -------------------------------
  # Die Logik liegt nur einmal vor (mk_md.py) und wird von zwei Seiten
  # benutzt: von der Verarbeitungskette direkt und von n8n ueber diesen
  # Dienst. Ohne ihn muesste n8n dieselbe Umformung nachbauen - und wuerde
  # bei jeder Verbesserung zurueckfallen.
  mkmd-dienst:
    build: ./mkmd-dienst
    image: ki4ki-mkmd:1
    container_name: ki4ki-mkmd
    restart: unless-stopped
    # kein veroeffentlichter Anschluss - nur im internen Netz erreichbar

volumes:
  modelle:
  docling-modelle:
  n8n-daten:
  anythingllm-daten:
  pruefdaten:
  austausch:
  austausch-json:
  austausch-md:
